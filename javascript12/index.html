<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header>
        <div class="logo">
            <span>My Collection</span>
            <h1><a href="./index.html">Movie Watchlist</a></h1>
        </div>
        <div class="stats-column">
            <div class="stat">
                <h3 id="total">0</h3>
                <p>TOTAL</p>
            </div>
            <div class="stat">
                <h3 id="completed">0</h3>
                <p>COMPLETED</p>
            </div>
            <div class="stat">
                <h3 id="minutes">0</h3>
                <p>MINS</p>
            </div>
        </div>
    </header>

    <div class="layout">
        <aside id="sidebar">
            <input type="text" id="search" placeholder="Search title...">
            <div class="content">
                <h5>STATUS</h5>
                <div class="item active">
                    <span>All Movies</span>
                    <span class="count" id="all">0</span>
                </div>

                <div class="item">
                    <span>Plan to Watch</span>
                    <span class="count" id="plan">0</span>
                </div>

                <div class="item">
                    <span>Watching</span>
                    <span class="count" id="watch">0</span>
                </div>

                <div class="item">
                    <span>Watched</span>
                    <span class="count" id="done">0</span>
                </div>
            </div>
            <hr>
            <div class="section">
                <h5>GENRE</h5>
                <select id="genre">
                    <option value="all">All genres</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Horror">Horror</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Animation">Animation</option>
                    <option value="Documentary">Documentary</option>
                    <option value="Romance">Romance</option>
                </select>
            </div>
            <button id="add-btn">+ Add Movie</button>
        </aside>

        <main>
            <div class="content-top">
                <span id="counter">0 movies</span>
                <select id="sort">
                    <option value="">Sort by</option>
                    <option value="title">Title A-Z</option>
                    <option value="year-desc">Year (newest)</option>
                    <option value="year-asc">Year (oldest)</option>
                    <option value="rating-desc">Rating (high)</option>
                    <option value="rating-asc">Rating (low)</option>
                </select>
            </div>



            <div class="table-head">
                <span>TITLE</span>
                <span>GENRE</span>
                <span>YEAR</span>
                <span>RATING</span>
                <span>STATUS</span>
            </div>



            <div id="list"></div>
        </main>


    </div>

    <div class="overlay hidden" id="overlay">
        <div class="modal">
            <button class="modal-close">x</button>
            <div class="modal-title" id="modal-title">Add Movie</div>
            <div class="field">
                <label>Title</label>
                <input type="text" id="f-title" placeholder="Write Movie Name...">
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Genre</label>
                    <select id="f-genre">
                        <option>Action</option>
                        <option>Comedy</option>
                        <option>Drama</option>
                        <option>Horror</option>
                        <option>Sci-Fi</option>
                        <option>Thriller</option>
                        <option>Animation</option>
                        <option>Documentary</option>
                        <option>Romance</option>
                    </select>
                </div>
                <div class="field">
                    <label>Year</label>
                    <input type="number" id="f-year" placeholder="2024" min="1900" max="2099">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Rating (1-10)</label>
                    <input type="number" id="f-rating" placeholder="8" min="1" max="10" step="0.1">
                </div>
                <div class="field">
                    <label>Status</label>
                    <select id="f-status">
                        <option>Plan to Watch</option>
                        <option>Watching</option>
                        <option>Watched</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Poster URL (optional)</label>
                <input type="text" id="f-poster" placeholder="URL://..">
            </div>
            <div class="field">
                <label>Comment</label>
                <textarea id="f-notes" placeholder="Your Comment"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel">Cancel</button>
                <button class="btn-save" id="btn-save" onclick="addMovie()">Add Movie</button>
            </div>
        </div>
    </div>


    <script src="./main.js"></script>
</body>

</html>
